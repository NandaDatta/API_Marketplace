services:
  app:
    build: .
    container_name: api-marketplace-app
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb+srv://nandadatta45_db_user:CY8v1vvM61bnMYrz@cluster0.smss76x.mongodb.net/api_marketplace?retryWrites=true&w=majority
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_super_secret_key_change_this
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: api-marketplace-redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
