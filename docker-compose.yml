services:
  app:
    build: .
    ports:
      - "5000:5000"  # Backend API
    depends_on:
      - mongo
      - redis
    environment:
      MONGO_URI: mongodb://mongo:27017/ai_marketplace
      REDIS_HOST: redis
      REDIS_PORT: 6379

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"  # Changed from 27017 to 27018
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    # No port mapping - internal only
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: